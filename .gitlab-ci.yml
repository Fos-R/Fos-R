build-win64-x86:
  tags:
    - ci.inria.fr
    - large
  stage: build
  image: rust
  script:
    - apt update
    - apt install -y binutils-mingw-w64-x86-64 gcc-mingw-w64
    - rustup target add x86_64-pc-windows-gnu
    - cargo build --target=x86_64-pc-windows-gnu -p fosr -r
  artifacts:
    paths:
      - target/*/release/fosr.exe

build-win32-x86:
  tags:
    - ci.inria.fr
    - large
  stage: build
  image: rust
  script:
    - apt update
    - apt install -y binutils-mingw-w64-x86-64 gcc-mingw-w64
    - rustup target add i686-pc-windows-gnu
    - cargo build --target=i686-pc-windows-gnu -p fosr -r
  artifacts:
    paths:
      - target/*/release/fosr.exe

build-wasm32:
  tags:
    - ci.inria.fr
    - large
  stage: build
  image: rust
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-bindgen-cli --version 0.2.108
    - cargo build -p fosr-gui -r --target wasm32-unknown-unknown --no-default-features --features models
    - wasm-bindgen --out-dir public --target web target/wasm32-unknown-unknown/release/fosr_gui.wasm --no-typescript
  artifacts:
    paths:
      - public/fosr_gui.js
      - public/fosr_gui_bg.wasm

test-audit:
  tags:
    - ci.inria.fr
    - large
  stage: test
  image: rust
  script:
    - cargo install cargo-audit
    - cargo audit -D unsound -D yanked
  allow_failure: true

test-publish:
  tags:
    - ci.inria.fr
    - large
  stage: test
  image: rust
  script:
    - rustup toolchain install nightly --component rust-src
    - cargo install bpf-linker
    - cargo build --release
    - cargo publish --dry-run
  allow_failure: true # it can fail on new version update

tests:
  tags:
    - ci.inria.fr
    - large
  stage: test
  image: rust
  script:
    # generation only, so no need for ebpf
    - cargo run -- create-pcap -o sample.pcap -s 0 -d 1h -t 0 -p fast --tz CET -m cupid
    - cargo test -p fosr -- --nocapture
  artifacts:
    when: always
    paths:
      - crates/fosr/deterministic-test.pcap # in case of an error
      - sample.pcap
  allow_failure: true

cupid-dataset:
  image: alpine
  tags:
    - ci.inria.fr
    - small
  stage: analyze
  script:
    - apk add graphviz
    - mkdir public/cupid
    - cd crates/fosr-lib/default_models/cupid/automata
    - ls *.dot | while read file; do dot -Tpng $file -o ../../../../../public/cupid/$file.png -Gdip=150; echo - \[$file\]\(cupid/$file.png\) >> ../../../../../public/dataset-cupid.md; done
    - cd ../../../../..
    - cp crates/fosr-lib/default_models/cupid/bn/bn_common.png public/cupid/bn.png
    - echo -e "\n## Bayesian network\n![](cupid/bn.png)" >> public/dataset-cupid.md
    - mv public/dataset-cupid.md public/cupid.md
    # TODO: add evaluation
  artifacts:
    paths:
      - public/cupid.md
      - public/cupid/

cicids17-dataset:
  image: alpine
  tags:
    - ci.inria.fr
    - small
  stage: analyze
  script:
    - apk add graphviz
    - mkdir public/cicids17
    - cd crates/fosr-lib/default_models/cicids17/automata
    - ls *.dot | while read file; do dot -Tpng $file -o ../../../../../public/cicids17/$file.png -Gdip=150; echo - \[$file\]\(cicids17/$file.png\) >> ../../../../../public/dataset-cicids17.md; done
    - cd ../../../../..
    - cp crates/fosr-lib/default_models/cicids17/bn/bn_common.png public/cicids17/bn.png
    - echo -e "\n## Bayesian network\n![](cicids17/bn.png)" >> public/dataset-cicids17.md
    - mv public/dataset-cicids17.md public/cicids17.md
    # TODO: add evaluation
  artifacts:
    paths:
      - public/cicids17.md
      - public/cicids17/

analysis:
  image: zeek/zeek
  tags:
    - ci.inria.fr
    - small
  stage: analyze
  script:
    - apt update
    - apt install -y zip tshark suricata
    - mkdir analysis
    - zeek -r sample.pcap Log::default_logdir="analysis"
    - capinfos sample.pcap > analysis/capinfos.txt
    - tshark -r sample.pcap -T fields -E header=y -E separator=, -e ip.len -e ip.ttl -e ip.src -e ip.dst -e ip.proto "eth.type == 0x0800" > analysis/ip.csv
    - tshark -r sample.pcap -T fields -E header=y -E separator=, -e tcp.flags "ip.proto == 6" > analysis/tcp.csv
    - tshark -r sample.pcap -z expert,warn -q > analysis/expert_info.txt
    - suricata -c /etc/suricata/suricata.yaml -r sample.pcap > analysis/suricata.txt
    - zip -r analysis.zip analysis
  artifacts:
    paths:
      - analysis.zip

pages:
  image: debian:bookworm # required to run fosr
  tags:
    - ci.inria.fr
    - small
  stage: deploy
  pages:
    publish: public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - apt update
    - apt install -y pandoc
    - mv doc public/
    - mv target public/bin
    - mv *.zip public/
    - mv sample.pcap public/
    - cat CHANGELOG.md >> public/changelog.md
    - cd public
    # update the build number
    - echo -e "\nBuild version $CI_COMMIT_SHORT_SHA, compiled on $(date -I) ([changelog](changelog.html)).\n" >> intro.md
    - chmod +x ./bin/x86_64-unknown-linux-gnu/release/fosr
    # add the --help output
    - ./bin/x86_64-unknown-linux-gnu/release/fosr create-pcap --help >> howto-pcap.md
    - echo "\`\`\`" >> howto-pcap.md
    # - ./bin/x86_64-unknown-linux-gnu/release/fosr inject --help >> howto-inject.md
    # - echo "\`\`\`" >> howto-inject.md
    - ./bin/x86_64-unknown-linux-gnu/release/fosr untaint --help >> howto-untaint.md
    - echo "\`\`\`" >> howto-untaint.md
    # update the deb file paths
    - sed -i -e "s/FOSR_VERSION/$(./bin/x86_64-unknown-linux-gnu/release/fosr -V | cut -d" " -f 2)/g" compile.md
    - pandoc intro.md compile.md howto-pcap.md howto-inject.md howto-untaint.md config_doc.md other_software.md schema.md lib.md roadmap.md usecases.md analysis.md limitations.md refs.md footer.md -o index.html --template template.html --include-after-body footer.html --standalone --toc --toc-depth 1
    - pandoc changelog.md -o changelog.html --template template.html --include-after-body footer.html --standalone --toc
    - pandoc cupid.md -o cupid.html --template template.html --include-after-body footer.html --standalone --toc
    - pandoc cicids17.md -o cicids17.html --template template.html --include-after-body footer.html --standalone --toc
    - rm *.md
  artifacts:
    paths:
      - public
