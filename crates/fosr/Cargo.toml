[package]
name = "fosr"
version = "0.1.0-dev"
authors = ["Samuel Cordon","Quentin Blin", "Pierre-François Gimenez <pierre-francois.gimenez@inria.fr>"]
edition = "2024"
description = "The GUI version of Fos-R (Forger Of Security Records), the ML-based synthetic network traffic generator"
homepage = "https://fosr.inria.fr"
repository = "https://gitlab.inria.fr/pirat-public/Fos-R"
license = "GPL-3.0"
categories = ["network-programming", "security", "science"]
keywords = ["networking", "ai", "security", "wasm", "gui"]

# Bundle metadata for macOS app
[package.metadata.bundle]
name = "Fos-R"
identifier = "com.inria.fosr"
icon = ["crates/fosr/assets/fosr-gui-macos.icns"]

[[bin]]
name = "fosr"
path = "src/main.rs"
# The binary is only compiled if the "native" feature is enabled.
# This avoids warnings when compiling for wasm32.
required-features = ["native"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# By default, we are compiling for native.
# If we want to compile for wasm32, we need to use the --no-default-features flag.
default = ["native", "models"]
models = ["fosr-lib/models_cupid", "fosr-lib/models_cicids17"]
native = []

[dependencies]
chrono = "0.4.44"
chrono-tz = "0.10.4"
eframe = "0.33.3"
egui_extras = { version = "0.33.3", features = ["chrono", "all_loaders", "syntect", "serde"] }
log = "0.4.30"
wasm-bindgen = "0.2.122"
fosr-lib = { version = "1.0.0-dev", path = "../fosr-lib", features = ["models_cupid"] }
rfd = "0.17.2"
humantime = "2.3.0"
serde = { version = "1", features = ["derive"] }
indicatif = "0.18.4"
web-time = "1.1.0"
petgraph = "0.8.3"
egui_graphs = { version = "0.29.0", features = ["events"] }
serde_yaml = "0.9"
strum = { version = "0.28", features = ["derive"] }
egui_material_icons = "0.5.0"
rand = "0.10.1"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.11.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.122"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = ["Element", "Document", "Window"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11.10", default-features = false, features = ["auto-color", "humantime"] }
tempfile = "3.27.0"
open = "5.3.5"
which = "8.0.2"
