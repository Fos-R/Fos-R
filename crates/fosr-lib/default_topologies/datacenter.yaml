metadata:
  title: Datacenter Network Configuration
  desc: A server-heavy setup with multiple server types
  author: FosR
  version: 1.0.0
  format: 1

networks:
  # ==================== LOAD BALANCER TIER ====================
  - subnet: 10.0.1.0
    mask: 24
    name: "Load Balancers"
    hosts:
      - hostname: lb-primary
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.1.10
            services:
              - https:443
              - http:80

      - hostname: lb-secondary
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.1.11
            services:
              - https:443
              - http:80

      - hostname: router
        interfaces:
          - ip_addr: 10.0.1.12
          - ip_addr: public

  # ==================== WEB SERVER TIER ====================
  - subnet: 10.0.2.0
    mask: 24
    name: "Web Servers"
    hosts:
      - hostname: web-server-01
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.2.10
            services:
              - https:443
              - http:80

      - hostname: web-server-02
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.2.11
            services:
              - https:443
              - http:80

      - hostname: web-server-03
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.2.12
            services:
              - https:443
              - http:80

      - hostname: router
        interfaces:
          - ip_addr: 10.0.1.13
          - ip_addr: 10.0.2.13

  # ==================== APPLICATION TIER ====================
  - subnet: 10.0.3.0
    mask: 24
    name: "Application Servers"
    hosts:
      - hostname: app-server-01
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.3.10
            services:
              - https:8443
              - ssh:22

      - hostname: app-server-02
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.3.11
            services:
              - https:8443
              - ssh:22

      - hostname: router
        interfaces:
          - ip_addr: 10.0.1.14
          - ip_addr: 10.0.3.12

  # ==================== ADMIN ====================
  - subnet: 10.0.8.0
    mask: 24
    name: "Admin"
    hosts:
      - hostname: admin
        os: linux
        type: user
        interfaces:
          - ip_addr: 10.0.8.1

      - hostname: router
        interfaces:
          - ip_addr: 10.0.6.20
          - ip_addr: 10.0.8.2

  # ==================== DATABASE TIER ====================
  - subnet: 10.0.4.0
    mask: 24
    name: "Database Servers"
    hosts:
      - hostname: db-primary
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.4.10
            services:
              - https:5432
              - ssh:22

      - hostname: db-replica-01
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.4.11
            services:
              - https:5432

      - hostname: db-replica-02
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.4.12
            services:
              - https:5432

      - hostname: router
        interfaces:
          - ip_addr: 10.0.2.21
          - ip_addr: 10.0.4.13

  # ==================== CACHE TIER ====================
  - subnet: 10.0.5.0
    mask: 24
    name: "Cache"
    hosts:
      - hostname: cache-server
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.5.10
            services:
              - https:6379

      - hostname: router
        interfaces:
          - ip_addr: 10.0.1.15
          - ip_addr: 10.0.5.11

  # ==================== MONITORING ====================
  - subnet: 10.0.6.0
    mask: 24
    name: "Monitoring"
    hosts:
      - hostname: monitoring-server
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.6.10
            services:
              - https:9090
              - ssh:22

      - hostname: router
        interfaces:
          - ip_addr: 10.0.1.16
          - ip_addr: 10.0.6.11

  # ==================== DNS ====================
  - subnet: 10.0.7.0
    mask: 24
    name: "DNS"
    hosts:
      - hostname: dns-server
        os: linux
        type: server
        interfaces:
          - ip_addr: 10.0.7.10
            services:
              - dns:53

      - hostname: router
        interfaces:
          - ip_addr: 10.0.7.11
          - ip_addr: 10.0.1.17

