metadata:
  title: Home Network Configuration
  desc: A simple home network with a router and workstations
  author: FosR
  version: 1.0.0
  format: 1

networks:
  - subnet: 192.168.1.0
    mask: 24
    name: "Home Network"
    hosts:
      - hostname: home-router
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.1.1
            services:
              - dns
              - http
          - ip_addr: public

      - hostname: workstation
        os: windows
        type: user
        interfaces:
          - ip_addr: 192.168.1.10

      - hostname: nas
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.1.20
            services:
              - https
              - ssh
