metadata:
  title: DEDALE Dataset Network
  desc: The topology of the testbed used for the DEDALE dataset.
  author: Pierre-François Gimenez
  version: 1.0.0
  format: 1

networks:
  - subnet: 172.16.255.0
    mask: 24
    name: "Green zone"
  - subnet: 172.16.1.0
    mask: 24
    name: "Internal"
    hosts:
      - interfaces: # Router
        - ip_addr: 172.16.1.1
        - ip_addr: 172.16.255.2
        - ip_addr: 172.16.0.1
