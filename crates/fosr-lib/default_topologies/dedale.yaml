  - subnet: 172.16.0.0
    mask: 24
    name: "Servers"
    hosts:
      - interfaces:
        - ip_addr: 172.16.0.2 # Internal Server
          services:
            - https
            - http
      - interfaces:
        - ip_addr: 172.16.0.3 # Log Server
          services:
            - https
            - http
  - subnet: 172.17.0.0
    mask: 16
    name: "DMZ"
    hosts:
      - interfaces: # Router
        - ip_addr: 172.17.0.1
        - ip_addr: 172.18.0.2
        - ip_addr: 172.16.255.1
      - interfaces:
        - ip_addr: 172.17.0.5 # VPN
          services:
            - https
            - http
        - ip_addr: 172.17.0.3
          services:
            - https
            - http
        - ip_addr: 172.17.0.2
          services:
            - https
            - http
  - subnet: 172.18.0.0
    mask: 16
    name: "Red zone 172.18"
    hosts:
      - interfaces: # Router
        - ip_addr: 172.18.0.3
        - ip_addr: 172.19.0.1
      - interfaces: # Router
        - ip_addr: 172.18.0.1
        - ip_addr: public


  - subnet: 172.19.0.0
    mask: 16
    name: "Red zone 172.19"
    hosts:
      - interfaces:
        - ip_addr: 172.19.0.254
          services:
            - imap
            - smtp
      - interfaces: # external clients
        - ip_addr: 172.19.0.3
      - interfaces:
