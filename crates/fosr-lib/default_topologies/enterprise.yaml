metadata:
  title: Enterprise Network Configuration
  desc: A multi-subnet demo network with common services
  author: FosR
  version: 1.0.0
  format: 1

networks:
  # ==================== DMZ SUBNET ====================
  - subnet: 192.168.10.0
    mask: 24
    name: "DMZ"
    hosts:
      - hostname: dmz-web-gateway
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.10.10
            services:
              - https:443
              - http:80
          - ip_addr: 10.0.0.10

      - hostname: dmz-dns-server
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.10.20
            services:
              - dns:53

      - hostname: dmz-mail-relay
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.10.30
            services:
              - smtp:587

      - hostname: router
        interfaces:
          - ip_addr: 192.168.10.1
          - ip_addr: public


  # ==================== APPLICATION SUBNET ====================
  - subnet: 192.168.20.0
    mask: 24
    name: "Application"
    hosts:
      - hostname: app-api-frontend
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.20.10
            services:
              - https:443
              - http:80

      - hostname: app-api-backend
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.20.20
            services:
              - https:8443

      - hostname: router
        interfaces:
          - ip_addr: 192.168.10.2
          - ip_addr: 192.168.20.1

  # ==================== DATABASE SUBNET ====================
  - subnet: 192.168.30.0
    mask: 24
    name: "Database"
    hosts:
      - hostname: db-primary
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.30.10
            services:
              - https:5432
          - ip_addr: 10.0.20.10
            services:
              - ssh:22

      - hostname: db-replica
        os: linux
        type: server
        interfaces:
          - ip_addr: 192.168.30.20
            services:
              - https:5432

      - hostname: router
        interfaces:
          - ip_addr: 192.168.10.3
          - ip_addr: 192.168.30.1

  # ==================== USER SUBNET ====================
  - subnet: 192.168.50.0
    mask: 24
    name: "Users"
    hosts:
      - hostname: admin-workstation
        os: linux
        type: user
        interfaces:
          - ip_addr: 192.168.50.100

      - hostname: dev-workstation-01
        os: linux
        type: user
        interfaces:
          - ip_addr: 192.168.50.101

      - hostname: dev-workstation-02
        os: linux
        type: user
        interfaces:
          - ip_addr: 192.168.50.102

      - hostname: router
        interfaces:
          - ip_addr: 192.168.10.3
          - ip_addr: 192.168.50.1

