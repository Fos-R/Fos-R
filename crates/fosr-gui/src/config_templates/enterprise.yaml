hosts:
  # ==================== DMZ SUBNET (192.168.10.x) ====================

  - hostname: dmz-web-gateway
    os: Linux
    usage: 2.5
    type: server
    client:
      - https
      - ssh
    interfaces:
      - ip_addr: 192.168.10.10
        mac_addr: 00:14:2A:3F:10:01
        services:
          - https:443
          - http:80
      - ip_addr: 10.0.0.10
        mac_addr: 00:14:2A:3F:10:02

  - hostname: dmz-dns-server
    os: Linux
    usage: 1.8
    type: server
    interfaces:
      - ip_addr: 192.168.10.20
        mac_addr: 00:14:2A:3F:10:03
        services:
          - dns:53

  - hostname: dmz-mail-relay
    os: Linux
    usage: 1.2
    type: server
    client:
