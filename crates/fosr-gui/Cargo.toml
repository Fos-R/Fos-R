[package]
name = "fosr-gui"
version = "0.1.0"
edition = "2024"
description = "A GUI for Fos-R."

[package.metadata.bundle]
name = "Fos-R"
identifier = "com.inria.fosr"
icon = ["crates/fosr-gui/assets/fosr-gui-macos.icns"]

[[bin]]
name = "fosr-gui"
path = "src/main.rs"
# The binary is only compiled if the "native" feature is enabled.
# This avoids warnings when compiling for wasm32.
required-features = ["native"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# By default, we are compiling for native.
# If we want to compile for wasm32, we need to use the --no-default-features flag.
default = ["native"]
native = []

[dependencies]
chrono = "0.4.43"
chrono-tz = "0.10.4"
eframe = "0.33.3"
egui_extras = { version = "0.33.3", features = ["chrono", "all_loaders", "syntect", "serde"] }
log = "0.4.29"
wasm-bindgen = "0.2.108"
fosr-lib = { version = "1.0.0-dev", path = "../fosr-lib", features = ["wasm_js"] }
rfd = "0.17.2"
humantime = "2.3.0"
serde = { version = "1", features = ["derive"] }
indicatif = "0.18.3"
web-time = "1.1.0"
petgraph = "0.8.3"
egui_graphs = { version = "0.29.0", features = ["events"] }
serde_yaml = "0.9"
egui_material_icons = "0.5.0"
rand = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Element", "Document", "Window"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
tempfile = "3.26.0"
open = "5.3.3"
which = "8.0.2"

